services:
  mariadb-mcp:
    # asyncmy wheels crash with SIGILL on native arm64 Docker (Apple Silicon).
    # Build and run as linux/amd64 only.
    platform: linux/amd64
    build:
      context: .
      platforms:
        - linux/amd64
    container_name: mariadb-mcp
    env_file: .env
    ports:
      - "9001:9001"
    external_links:
      - mariadb:mariadb
    network_mode: bridge

